{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="#">MyBlog</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Posts</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Categories</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
      </ul>
      <ul class="navbar-nav ms-auto">
          {% if request.user.is_authenticated %}
          <li class="nav-item"><a class="btn btn-outline-primary me-2" href="{% url 'logout' %}">Logout</a></li>
          {% else %}
        <li class="nav-item"><a class="btn btn-outline-primary me-2" href="{% url 'login' %}">Login</a></li>
        <li class="nav-item"><a class="btn btn-primary" href="{% url 'register' %}">Register</a></li>
          {% endif %}
      </ul>
    </div>
  </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock content %}
</div>

<!-- FOOTER -->
<footer class="bg-white border-top py-4 mt-auto">
  <div class="container d-flex justify-content-between align-items-center">
    <span class="text-muted">© 2025 MyBlog. All rights reserved.</span>
    <div class="d-flex gap-3">
      <a href="#" class="text-muted text-decoration-none">Privacy</a>
      <a href="#" class="text-muted text-decoration-none">Terms</a>
      <a href="#" class="text-muted text-decoration-none">Contact</a>
    </div>
  </div>
</footer>

</body>
</html>
