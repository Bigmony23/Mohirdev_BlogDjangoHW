{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="row">
      <div class="col-8">
          <form method="post" action="{% url 'add_post' %}" enctype="multipart/form-data">
              {% csrf_token %}
              {{ post_form |crispy }}
              <div class="mt-3">
              <button class="btn btn-primary" type="submit"> Add post</button>
              </div>
          </form>

      </div>
    </div>
{% endblock content %}
