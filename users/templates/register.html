{%  extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<h1>Register</h1>
<div class="row">

<div class="col-4 mb-4">
<form method="post" action="{% url 'register' %}">
    {% csrf_token %}
    {{ register_form| crispy }}
    <div class="mt-3">
    <button class="btn btn-primary" type="submit"> Register</button>
    </div>
</form>
</div>
</div>
{% endblock content %}
